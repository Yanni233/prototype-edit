<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>原型编辑器插件演示</title>
  <link rel="stylesheet" href="./prototype-editor.css">
  <style>
    body{max-width:900px;margin:48px auto;padding:0 24px;background:#f6f8fc;color:#1d2c47;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}.card{margin:18px 0;padding:24px;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(37,55,88,.08)}button{padding:8px 12px;border:0;border-radius:6px;background:#2878f0;color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:10px;border:1px solid #dfe7f2;text-align:left}img{width:160px;border-radius:8px}.search{padding:9px;border:1px solid #ccd8e9;border-radius:6px}
  </style>
</head>
<body>
  <section class="card"><h1>项目概览</h1><p>这是可嵌入任意 HTML 的编辑器演示页。</p><button type="button">新建项目</button> <a href="https://example.com">查看帮助</a></section>
  <section class="card"><label>项目名称 <input class="search" placeholder="请输入项目名称"></label></section>
  <section class="card"><h2>项目清单</h2><table><thead><tr><th>项目</th><th>负责人</th><th>状态</th></tr></thead><tbody><tr><td>官网改版</td><td>小王</td><td>进行中</td></tr><tr><td>客户活动</td><td>小李</td><td>待开始</td></tr><tr><td>数据看板</td><td>小陈</td><td>已完成</td></tr></tbody></table></section>
  <section class="card"><h2>本周工时</h2><table><tbody><tr><td>设计</td><td>18 小时</td></tr><tr><td>开发</td><td>26 小时</td></tr><tr><td>测试</td><td>12 小时</td></tr></tbody></table></section>
  <section class="card"><h2>任务跟进</h2><table><thead><tr><th>任务</th><th>截止日期</th><th>操作</th></tr></thead><tbody><tr><td>确认需求范围</td><td>2026-11-14</td><td><button type="button">查看</button></td></tr><tr><td>输出交互稿</td><td>2026-11-18</td><td><button type="button">催办</button></td></tr></tbody></table></section>
  <script src="./prototype-editor.js"></script>
  <script>PrototypeEditor.init({ exportFileName:'原型编辑器演示-编辑版.html' });</script>
</body>
</html>
